name: Region 9 Live Studio Alpha 8
on:
  push:
    paths:
      - 'plugins/region9-live-studio/**'
      - 'inc/live-studio-integration.php'
      - 'functions.php'
      - 'front-page.php'
      - 'page.php'
      - 'header.php'
      - 'footer.php'
      - 'style.css'
      - 'template-parts-studio-home.php'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/alpha8-live-studio.yml'
  pull_request:
    paths:
      - 'plugins/region9-live-studio/**'
      - '**.php'
      - 'style.css'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/alpha8-live-studio.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint plugin PHP
        run: find plugins/region9-live-studio -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Lint changed theme PHP
        run: php -l functions.php && php -l page.php && php -l template-parts-studio-home.php && php -l inc/live-studio-integration.php
      - name: Run validation suite
        run: php scripts/validate-region9-live-studio.php
      - name: Theme RC1 admin integration check
        run: php scripts/validate-theme-rc1-admin-integration.php
      - name: RC1 public surface preservation check
        run: php scripts/validate-rc1-public-surface.php
      - name: v15/v17 parity inventory guard
        run: php scripts/validate-v15-parity.php
      - name: Build plugin ZIP
        run: bash scripts/build-region9-live-studio-zip.sh
      - name: Build staging theme ZIP
        run: |
          set -euo pipefail
          rm -rf build/theme-package
          mkdir -p build/theme-package/region9-weather-theme-1
          rsync -a ./ build/theme-package/region9-weather-theme-1/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='build/' \
            --exclude='plugins/' \
            --exclude='scripts/' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='vendor/' \
            --exclude='node_modules/'
          test -f build/theme-package/region9-weather-theme-1/style.css
          test -f build/theme-package/region9-weather-theme-1/functions.php
          test -f build/theme-package/region9-weather-theme-1/header.php
          test -f build/theme-package/region9-weather-theme-1/front-page.php
          (cd build/theme-package && zip -qr ../region9-weather-hub-staging-theme.zip region9-weather-theme-1)
          unzip -t build/region9-weather-hub-staging-theme.zip
      - name: Verify generated release artifacts
        run: |
          set -euo pipefail
          mapfile -t zips < <(find build -maxdepth 1 -type f -name 'region9-live-studio-*.zip' | sort)
          if [ "${#zips[@]}" -ne 1 ]; then
            printf 'Expected exactly one Region 9 Live Studio ZIP, found %s:\n' "${#zips[@]}" >&2
            printf '%s\n' "${zips[@]:-}" >&2
            exit 1
          fi
          zip="${zips[0]}"
          echo "ZIP=$zip" >> "$GITHUB_ENV"
          unzip -t "$zip"
          unzip -l "$zip" region9-live-studio/region9-live-studio.php | grep -q 'region9-live-studio/region9-live-studio.php'
          unzip -l build/region9-weather-hub-staging-theme.zip region9-weather-theme-1/style.css | grep -q 'region9-weather-theme-1/style.css'
          if [ -f build/SHA256SUMS.txt ]; then
            (cd build && sha256sum -c SHA256SUMS.txt)
            grep -Fq "$(basename "$zip")" build/SHA256SUMS.txt
          fi
          manifest=$(find build -maxdepth 1 -type f -name 'region9-live-studio-*-manifest.json' | sort | head -n 1 || true)
          if [ -n "$manifest" ]; then
            echo "MANIFEST=$manifest" >> "$GITHUB_ENV"
            python - <<'PY' "$manifest" "$zip"
          import json, os, sys
          manifest_path, zip_path = sys.argv[1:3]
          with open(manifest_path, encoding='utf-8') as fh:
              data = json.load(fh)
          artifacts = data.get('artifacts') or []
          expected = os.path.basename(zip_path)
          if len(artifacts) != 1 or artifacts[0].get('file') != expected:
              raise SystemExit(f'manifest artifact mismatch: expected {expected}, got {artifacts!r}')
          if artifacts[0].get('size_bytes') != os.path.getsize(zip_path):
              raise SystemExit('manifest size does not match ZIP size')
          PY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: region9-live-studio-release-artifacts
          path: |
            build/region9-live-studio-*.zip
            build/region9-weather-hub-staging-theme.zip
            build/SHA256SUMS.txt
            build/region9-live-studio-*-manifest.json
            build/rc1-public-surface-report.json
            build/v15-parity-report.json
          if-no-files-found: error
